name: Release & Chrome Web Store Upload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish automatically to Chrome Web Store (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-publish:
    name: Package and Publish Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update manifest.json version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating manifest.json version to: ${VERSION}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json
          cat manifest.json

      - name: Package Extension ZIP
        run: |
          zip -r clear-feed.zip . -x "*.git*" "*.github*" "GEMINI.md" "*.DS_Store"
          echo "ZIP created successfully:"
          unzip -l clear-feed.zip

      - name: Upload Zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: clear-feed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: 'clear-feed.zip'
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: ${{ inputs.publish || false }}
