<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      width: 250px;
      font-family: 'Fredoka', sans-serif;
      padding: 15px;
      background-color: #ffffff;
      margin: 0;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header img {
      width: 40px;
      height: 40px;
    }

    h2 {
      font-size: 18px;
      margin: 5px 0;
      color: #333;
    }

    .section {
      border-top: 1px solid #eee;
      padding: 12px 0;
    }

    .section-title {
      font-weight: 600;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #444;
      margin-bottom: 5px;
    }

    /* Switch Style */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #2196F3;
    }

    input:checked+.slider:before {
      transform: translateX(14px);
    }

    .metrics {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-around;
      font-size: 12px;
    }

    .metric-value {
      font-weight: 600;
      color: #2196F3;
    }

    .dev {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 10px;
      color: #999;
      text-decoration: none;
    }

    .affiliate-message {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #666;
      background: #fff8e1;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid #ffe082;
    }

    .affiliate-message:hover {
      background: #ffecb3;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="images/icon.png">
    <h2>NoReels</h2>
  </div>

  <!-- YouTube Section -->
  <div class="section">
    <div class="section-title">YouTube</div>
    <div class="control-item">
      <span>Block Shorts</span>
      <label class="switch">
        <input type="checkbox" id="yt-shorts" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-item">
      <span>Hide Comments</span>
      <label class="switch">
        <input type="checkbox" id="yt-comments" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-item">
      <span>Home Recommendations</span>
      <label class="switch">
        <input type="checkbox" id="yt-home" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-item">
      <span>Video Recommendations</span>
      <label class="switch">
        <input type="checkbox" id="yt-video-rec" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Instagram Section -->
  <div class="section">
    <div class="section-title">Instagram</div>
    <div class="control-item">
      <span>Block Reels</span>
      <label class="switch">
        <input type="checkbox" id="ig-reels" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Facebook Section -->
  <div class="section">
    <div class="section-title">Facebook</div>
    <div class="control-item">
      <span>Block Reels</span>
      <label class="switch">
        <input type="checkbox" id="fb-reels" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-item">
      <span>Block Stories</span>
      <label class="switch">
        <input type="checkbox" id="fb-stories" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="metrics">
    <div>Blocked: <span id="total-blocked" class="metric-value">0</span></div>
    <div>Saved: <span id="time-saved" class="metric-value">0m</span></div>
  </div>

  <!-- Support Affiliate Message -->
  <a href="https://amzn.to/3Q2wrRr" target="_blank" class="affiliate-message">
    __MSG_affiliateMessage__
  </a>

  <a href="https://www.linkedin.com/in/matheus-pedrosa-custodio/" target="_blank" class="dev">Developed by Matheus Pedrosa</a>

  <script src="popup.js"></script>
</body>

</html>
